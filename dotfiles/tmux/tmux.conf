set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin '27medkamal/tmux-session-wizard'

set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-statusbar-alpha 'true'
set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'
set -g default-terminal 'tmux-256color'
set -g mouse on
set -g status-position top
set -s copy-command 'xclip -in -selection clipboard'

unbind C-b
set -g prefix M-a
bind M-a send-prefix
bind R command-prompt 'rename-session %%'
bind -n M-space next-layout
bind x kill-window
bind X confirm-before -p 'kill-session #S? (y/n)' kill-session
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Config Reloaded!'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Down resize-pane -D
bind -n M-Up resize-pane -U
bind -n M-Left resize-pane -L
bind -n M-Right resize-pane -R
bind M-k switch-client -n
bind M-j switch-client -p
bind N command-prompt -p 'New session name:' "if-shell 'tmux has-session -t %% 2>/dev/null' 'switch-client -t %%' 'new-session -s %%'"
bind-key -n M-s if -F '#{==:#{window_name},popup}' 'kill-window' 'display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "$SHELL"'

run '~/.config/tmux/plugins/tpm/tpm'
